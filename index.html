<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台東紅烏龍茶消費行為調查</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #FDF8F3; }
        .survey-card { display: none; }
        .survey-card.active { display: block; animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="min-h-screen py-10 px-4">
        <!-- 頂部標題 -->
        <nav class="max-w-2xl mx-auto mb-8 flex items-center gap-3">
            <div class="w-12 h-12 bg-orange-600 rounded-2xl flex items-center justify-center text-white text-2xl shadow-lg">🍵</div>
            <h1 class="text-2xl font-black text-orange-900">紅烏龍調查系統</h1>
        </nav>

        <main class="max-w-2xl mx-auto">
            <!-- 這裡是表單開始 -->
            <!-- ⚠️ 重要：請將下面的 your-email@example.com 改成您的真實 Email ⚠️ -->
            <form action="https://formsubmit.co/flps9817@gmail.com" method="POST" id="mainForm" class="bg-white rounded-3xl shadow-2xl overflow-hidden border border-orange-100">
                
                <!-- 隱藏設定：提交後跳轉到感謝頁面 -->
                <input type="hidden" name="_next" value="https://google.com"> <!-- 您可以改成您的 GitHub 網址 -->
                <input type="hidden" name="_subject" value="新的紅烏龍問卷回覆！">
                <input type="hidden" name="_captcha" value="false">

                <!-- 第一頁：飲用習慣 -->
                <div id="step1" class="survey-card active">
                    <div class="bg-orange-600 p-8 text-white">
                        <h2 class="text-2xl font-bold">第一部分：飲用習慣</h2>
                        <p class="opacity-80 text-sm mt-2">請根據您的實際情況勾選</p>
                    </div>
                    <div class="p-8 space-y-6">
                        <div class="space-y-4">
                            <p class="font-bold text-gray-700">1. 您是否有飲用過「紅烏龍茶」？</p>
                            <div class="grid grid-cols-2 gap-4">
                                <label class="cursor-pointer">
                                    <input type="radio" name="1.是否有飲用過" value="是" class="hidden peer" required onclick="toggleNextSteps(true)">
                                    <div class="p-4 text-center border-2 rounded-2xl peer-checked:border-orange-500 peer-checked:bg-orange-50 peer-checked:text-orange-600 text-gray-400 font-bold transition-all">是</div>
                                </label>
                                <label class="cursor-pointer">
                                    <input type="radio" name="1.是否有飲用過" value="否" class="hidden peer" onclick="toggleNextSteps(false)">
                                    <div class="p-4 text-center border-2 rounded-2xl peer-checked:border-red-500 peer-checked:bg-red-50 peer-checked:text-red-600 text-gray-400 font-bold transition-all">否</div>
                                </label>
                            </div>
                        </div>

                        <!-- 隱藏題：只有選「是」才出現 -->
                        <div id="conditionalQuestions" class="space-y-6 hidden">
                            <div class="space-y-3">
                                <p class="font-bold text-gray-700">2. 平均而言，您多久飲用一次？</p>
                                <select name="2.飲用頻率" class="w-full p-4 bg-gray-50 border rounded-2xl outline-none focus:ring-2 focus:ring-orange-500">
                                    <option value="每天">每天</option>
                                    <option value="每週3-5次">每週3-5次</option>
                                    <option value="每週1-2次">每週1-2次</option>
                                    <option value="偶爾">偶爾</option>
                                </select>
                            </div>
                        </div>

                        <button type="button" onclick="nextStep(2)" class="w-full bg-orange-600 text-white font-black py-4 rounded-2xl shadow-lg mt-4">下一步</button>
                    </div>
                </div>

                <!-- 第二頁：基本資料 -->
                <div id="step2" class="survey-card">
                    <div class="bg-gray-800 p-8 text-white">
                        <h2 class="text-2xl font-bold">第二部分：基本資料</h2>
                        <p class="opacity-80 text-sm mt-2">最後一小步，感謝您的協助！</p>
                    </div>
                    <div class="p-8 space-y-6">
                        <div class="space-y-4">
                            <p class="font-bold text-gray-700">您的性別：</p>
                            <select name="性別" class="w-full p-4 bg-gray-50 border rounded-2xl">
                                <option value="男">男</option>
                                <option value="女">女</option>
                                <option value="其他">其他</option>
                            </select>
                        </div>
                        <div class="space-y-4">
                            <p class="font-bold text-gray-700">您的年齡：</p>
                            <select name="年齡層" class="w-full p-4 bg-gray-50 border rounded-2xl">
                                <option value="18歲以下">18歲以下</option>
                                <option value="19-40歲">19-40歲</option>
                                <option value="41-55歲">41-55歲</option>
                                <option value="56歲以上">56歲以上</option>
                            </select>
                        </div>
                        <div class="flex gap-4">
                            <button type="button" onclick="nextStep(1)" class="flex-1 bg-gray-100 text-gray-500 font-bold py-4 rounded-2xl">回上一步</button>
                            <button type="submit" class="flex-[2] bg-green-600 text-white font-black py-4 rounded-2xl shadow-lg">送出問卷</button>
                        </div>
                    </div>
                </div>
            </form>

            <p class="text-center text-gray-400 text-xs mt-8">© 2024 紅烏龍消費行為研究小組</p>
        </main>
    </div>

    <script>
        function nextStep(step) {
            document.querySelectorAll('.survey-card').forEach(el => el.classList.remove('active'));
            document.getElementById('step' + step).classList.add('active');
            window.scrollTo(0, 0);
        }

        function toggleNextSteps(show) {
            const extra = document.getElementById('conditionalQuestions');
            if(show) {
                extra.classList.remove('hidden');
            } else {
                extra.classList.add('hidden');
            }
        }
    </script>
</body>
</html>

```
