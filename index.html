<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台東紅烏龍茶消費行為調查</title>
    <!-- 核心資源 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- 特效: Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #fdf8f3; color: #431407; margin: 0; padding: 0; overflow-x: hidden; }
        .fade-in { animation: fadeIn 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .checkbox-custom:checked + div { border-color: #ea580c; background-color: #fff7ed; color: #9a3412; transform: scale(1.02); box-shadow: 0 4px 12px rgba(234, 88, 12, 0.1); }
        .success-msg-animate { animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes bounceIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Firebase 配置
        const firebaseConfig = {
            apiKey: "AIzaSyDkrc26jr_XlaDDbtyg0W59qwH274Hm8Bw", 
            authDomain: "redoolong-c14a7.firebaseapp.com", 
            projectId: "redoolong-c14a7", 
            storageBucket: "redoolong-c14a7.firebasestorage.app",
            messagingSenderId: "250286622698",
            appId: "1:250286622698:web:bf7d5f22bdd7fcbac41493"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        const App = () => {
            const [view, setView] = useState('survey'); 
            const [isAdmin, setIsAdmin] = useState(false);
            const [clickCount, setClickCount] = useState(0);
            const [responses, setResponses] = useState([]);
            const [isSubmitted, setIsSubmitted] = useState(false);

            const initialForm = {
                q1: '', q2: '', q3: '', q4: [], q4_other: '', 
                q5: [], q6: [], q7: '', q8: '', q9: '', q10: '', q10_other: ''
            };
            const [form, setForm] = useState(initialForm);

            useEffect(() => {
                auth.signInAnonymously().catch(console.error);
            }, []);

            useEffect(() => {
                if (!isAdmin) return;
                const unsub = db.collection('responses').orderBy('time', 'desc').onSnapshot(snap => {
                    setResponses(snap.docs.map(d => ({id: d.id, ...d.data()})));
                }, err => console.error("Firestore Error:", err));
                return () => unsub();
            }, [isAdmin]);

            const triggerConfetti = () => {
                confetti({
                    particleCount: 150,
                    spread: 70,
                    origin: { y: 0.8 },
                    colors: ['#ea580c', '#f97316', '#fbbf24']
                });
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                
                // 立即顯示成功
                setIsSubmitted(true);
                triggerConfetti();

                // 背景傳送
                db.collection('responses').add({
                    ...form,
                    time: new Date().toISOString()
                }).catch(err => console.error("背景傳送失敗:", err));
            };

            const toggleCheck = (field, val, max = 99) => {
                if (isSubmitted) return; 
                setForm(prev => {
                    const list = prev[field];
                    if (list.includes(val)) return {...prev, [field]: list.filter(v => v !== val)};
                    if (list.length >= max) return prev;
                    return {...prev, [field]: [...list, val]};
                });
            };

            const handleSecretClick = () => {
                setClickCount(prev => {
                    if (prev + 1 >= 5) { setIsAdmin(true); setView('admin'); return 0; }
                    return prev + 1;
                });
                setTimeout(() => setClickCount(0), 3000);
            };

            const getStats = (key) => {
                const map = {};
                responses.forEach(r => {
                    const val = r[key];
                    if (Array.isArray(val)) val.forEach(v => map[v] = (map[v] || 0) + 1);
                    else if (val) map[val] = (map[val] || 0) + 1;
                });
                return map;
            };

            const StatItem = ({ title, qKey, denominator }) => {
                const data = getStats(qKey);
                const items = Object.entries(data).sort((a,b)=>b[1]-a[1]);
                return (
                    <div className="bg-white p-6 rounded-3xl border border-orange-50 shadow-sm">
                        <h4 className="font-bold text-orange-900 text-xs mb-4 flex items-center gap-2">
                            <span className="w-1.5 h-3 bg-orange-600 rounded-full"></span> {title}
                        </h4>
                        <div className="space-y-4">
                            {items.length === 0 ? <p className="text-gray-300 text-[10px] italic">尚未收集到資料</p> : items.map(([label, count]) => {
                                const ratio = denominator > 0 ? ((count/denominator)*100).toFixed(1) : 0;
                                return (
                                    <div key={label}>
                                        <div className="flex justify-between text-[10px] font-bold text-gray-500 mb-1">
                                            <span className="truncate pr-2">{label}</span>
                                            <span>{count} 票 ({ratio}%)</span>
                                        </div>
                                        <div className="w-full bg-gray-100 h-1.5 rounded-full overflow-hidden">
                                            <div className="bg-orange-500 h-full transition-all duration-1000" style={{width: `${ratio}%`}}></div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen">
                    <nav className="max-w-4xl mx-auto p-6 flex justify-between items-center">
                        <div onClick={handleSecretClick} className="flex items-center gap-3 cursor-pointer select-none active:scale-95 transition-transform group">
                            <div className="w-12 h-12 bg-orange-600 rounded-2xl flex items-center justify-center text-white text-2xl shadow-lg group-hover:rotate-6 transition-transform">🍵</div>
                            <div>
                                <h1 className="font-black text-orange-900 text-xl tracking-tighter">紅烏龍調查</h1>
                                <p className="text-[10px] text-orange-500 font-bold uppercase tracking-widest mt-0.5">Research Center</p>
                            </div>
                        </div>
                        {isAdmin && (
                            <div className="flex bg-white rounded-2xl p-1 shadow-sm border border-orange-100 font-bold text-[10px]">
                                <button onClick={() => setView('survey')} className={`px-4 py-2 rounded-xl transition-all ${view==='survey'?'bg-orange-600 text-white shadow-lg':'text-gray-400 hover:text-orange-600'}`}>問卷介面</button>
                                <button onClick={() => setView('admin')} className={`px-4 py-2 rounded-xl transition-all ${view==='admin'?'bg-orange-600 text-white shadow-lg':'text-gray-400 hover:text-orange-600'}`}>數據統計</button>
                            </div>
                        )}
                    </nav>

                    <main className="max-w-4xl mx-auto px-4 fade-in pb-20">
                        {view === 'survey' && (
                            <div className="max-w-2xl mx-auto bg-white rounded-[3rem] shadow-2xl overflow-hidden border border-orange-50 border-b-8 border-orange-600">
                                <div className="bg-orange-600 p-10 text-white text-center">
                                    <h2 className="text-2xl md:text-3xl font-black mb-2">台東紅烏龍茶消費行為調查</h2>
                                    <p className="text-sm font-bold opacity-90 mb-4 tracking-wide">組員：徐芝樺、游閔智、許子澄、楊川懿、孫仲瑋、廖佳娸</p>
                                    <p className="text-xs opacity-80 leading-relaxed max-w-sm mx-auto font-medium border-t border-white/20 pt-4">
                                        您好！感謝您撥冗參加本研究。本問卷資料採匿名方式，僅供整體統計分析之用，請安心填寫。
                                    </p>
                                </div>

                                <div className="p-8 md:p-12 space-y-12">
                                    <section className="space-y-6">
                                        <h3 className="text-lg font-black text-orange-900 border-l-4 border-orange-600 pl-3">第一部分：飲用習慣與消費量</h3>
                                        <div className="space-y-4">
                                            <p className="font-bold text-gray-700">1. 您是否有飲用過「紅烏龍茶」？</p>
                                            <div className="grid grid-cols-2 gap-4">
                                                {['是', '否'].map(o => (
                                                    <label key={o} className="cursor-pointer">
                                                        <input type="radio" name="q1" className="hidden" checked={form.q1===o} onChange={()=>setForm({...form, q1: o})} required disabled={isSubmitted} />
                                                        <div className={`p-5 rounded-2xl border-2 font-bold text-center transition-all ${form.q1===o?'border-orange-500 bg-orange-50 text-orange-600 shadow-inner scale-[0.98]':'border-gray-100 text-gray-400 hover:border-orange-200'}`}>{o}</div>
                                                    </label>
                                                ))}
                                            </div>
                                        </div>

                                        {form.q1 === '是' && (
                                            <div className="space-y-10 fade-in pt-4 border-t border-dashed border-orange-100">
                                                <div className="space-y-3">
                                                    <p className="font-bold text-gray-700 text-sm">2. 您多久飲用一次紅烏龍茶？</p>
                                                    <div className="grid grid-cols-1 gap-2">
                                                        {['每天','每週3-5次','每週1-2次','每月1-2次','偶爾'].map(o => (
                                                            <label key={o} className="flex items-center p-4 border rounded-2xl cursor-pointer hover:bg-orange-50/50 group transition-colors">
                                                                <input type="radio" name="q2" checked={form.q2===o} onChange={()=>setForm({...form, q2: o})} className="w-5 h-5 accent-orange-600" disabled={isSubmitted} />
                                                                <span className="ml-4 text-gray-600 font-medium group-hover:text-orange-900 transition-colors">{o}</span>
                                                            </label>
                                                        ))}
                                                    </div>
                                                </div>
                                                <div className="space-y-3">
                                                    <p className="font-bold text-gray-700 text-sm">3. 您每次飲用的平均量約為？</p>
                                                    <div className="grid grid-cols-1 gap-2">
                                                        {['200ml以下','201ml-400ml','401ml-600ml','601ml以上'].map(o => (
                                                            <label key={o} className="flex items-center p-4 border rounded-2xl cursor-pointer hover:bg-orange-50/50 transition-colors">
                                                                <input type="radio" name="q3" checked={form.q3===o} onChange={()=>setForm({...form, q3: o})} className="w-5 h-5 accent-orange-600" disabled={isSubmitted} />
                                                                <span className="ml-4 text-gray-600 font-medium">{o}</span>
                                                            </label>
                                                        ))}
                                                    </div>
                                                </div>
                                                <div className="space-y-3">
                                                    <p className="font-bold text-gray-700 text-sm">4. 您通常透過何種方式飲用？(可複選)</p>
                                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                                        {['自己沖泡','手搖飲店購買','賣場罐裝飲品','台東旅遊當地飲用'].map(o => (
                                                            <label key={o} className="relative cursor-pointer group">
                                                                <input type="checkbox" className="hidden checkbox-custom" checked={form.q4.includes(o)} onChange={()=>toggleCheck('q4', o)} disabled={isSubmitted} />
                                                                <div className="p-4 rounded-2xl border-2 text-[10px] font-black text-center transition-all"> {o} </div>
                                                            </label>
                                                        ))}
                                                    </div>
                                                </div>

                                                <h3 className="text-lg font-black text-orange-900 border-l-4 border-orange-600 pl-3 pt-6">第二部分：偏好與品牌認知</h3>
                                                <div className="space-y-3">
                                                    <p className="font-bold text-gray-700 text-sm">5. 喜歡紅烏龍的主要原因？(可複選)</p>
                                                    <div className="space-y-2">
                                                        {['獨特的熟果香味與蜜香韻味','茶湯甘醇回甘、不苦澀','耐沖泡且冷熱飲皆宜','支持台東在地農產品','包裝精美適合送禮'].map(o => (
                                                            <label key={o} className="relative cursor-pointer block">
                                                                <input type="checkbox" className="hidden checkbox-custom" checked={form.q5.includes(o)} onChange={()=>toggleCheck('q5', o)} disabled={isSubmitted} />
                                                                <div className="p-4 rounded-2xl border-2 text-[11px] font-black transition-all"> {o} </div>
                                                            </label>
                                                        ))}
                                                    </div>
                                                </div>
                                                <div className="space-y-3">
                                                    <p className="font-bold text-gray-700 text-sm">6. 購買時最看重的因素？(前三名)</p>
                                                    <div className="grid grid-cols-2 gap-2">
                                                        {['價格實惠','產地證明','有機無毒','品牌知名度','外包裝設計','烘焙口感'].map(o => (
                                                            <label key={o} className="relative cursor-pointer">
                                                                <input type="checkbox" className="hidden checkbox-custom" checked={form.q6.includes(o)} onChange={()=>toggleCheck('q6', o, 3)} disabled={isSubmitted} />
                                                                <div className="p-3 rounded-xl border-2 text-[10px] text-center font-bold transition-all"> {o} </div>
                                                            </label>
                                                        ))}
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </section>

                                    <section className="space-y-8 pt-10 border-t border-orange-100">
                                        <h3 className="text-lg font-black text-orange-900 border-l-4 border-orange-600 pl-3">第三部分：基本資料</h3>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                                            <div className="space-y-2">
                                                <p className="text-[10px] font-black text-orange-800 ml-1">您的性別</p>
                                                <select value={form.q8} onChange={e=>setForm({...form, q8:e.target.value})} className="w-full p-4 border-2 rounded-2xl bg-gray-50 outline-none focus:border-orange-500 font-bold text-sm transition-colors" required disabled={isSubmitted}>
                                                    <option value="">選擇性別</option><option value="男">男</option><option value="女">女</option><option value="其他">其他</option>
                                                </select>
                                            </div>
                                            <div className="space-y-2">
                                                <p className="text-[10px] font-black text-orange-800 ml-1">您的年齡層</p>
                                                <select value={form.q9} onChange={e=>setForm({...form, q9:e.target.value})} className="w-full p-4 border-2 rounded-2xl bg-gray-50 outline-none focus:border-orange-500 font-bold text-sm transition-colors" required disabled={isSubmitted}>
                                                    <option value="">選擇年齡</option>
                                                    {['18歲以下','19-25歲','26-40歲','41-55歲','56歲以上'].map(a => <option key={a} value={a}>{a}</option>)}
                                                </select>
                                            </div>
                                        </div>
                                        <div className="p-6 bg-orange-50/50 rounded-3xl border-2 border-orange-100 border-dashed">
                                            <p className="text-[10px] font-black text-orange-800 mb-4 uppercase">10. 居住地</p>
                                            <div className="flex flex-col sm:flex-row gap-6 px-2">
                                                <label className="flex items-center cursor-pointer"><input type="radio" name="q10" checked={form.q10==='台東'} onChange={()=>setForm({...form, q10:'台東'})} className="w-5 h-5 accent-orange-600" disabled={isSubmitted}/><span className="ml-3 font-bold text-gray-700 text-sm">台東縣市</span></label>
                                                <div className="flex items-center flex-1 border-b-2 border-orange-200 focus-within:border-orange-500 transition-all">
                                                    <input type="radio" name="q10" checked={form.q10==='其他'} onChange={()=>setForm({...form, q10:'其他'})} className="w-5 h-5 accent-orange-600" disabled={isSubmitted}/>
                                                    <span className="ml-3 font-bold text-gray-700 text-sm shrink-0">其他：</span>
                                                    <input type="text" className="w-full bg-transparent p-2 text-sm outline-none font-bold placeholder:text-gray-300" value={form.q10_other} onChange={e=>setForm({...form, q10_other: e.target.value, q10: '其他'})} placeholder="請填寫居住城市" disabled={isSubmitted} />
                                                </div>
                                            </div>
                                        </div>
                                    </section>

                                    <div className="space-y-4">
                                        <button 
                                            onClick={handleSubmit}
                                            disabled={isSubmitted || !form.q1} 
                                            className={`w-full bg-orange-600 hover:bg-orange-700 text-white font-black py-6 rounded-[2rem] shadow-xl shadow-orange-200 transition-all text-lg tracking-widest relative overflow-hidden ${isSubmitted ? 'cursor-default opacity-80' : 'active:scale-[0.98]'}`}
                                        >
                                            {isSubmitted ? "✅ 問卷已成功送出" : "提交完整問卷"}
                                        </button>

                                        {isSubmitted && (
                                            <div className="success-msg-animate bg-green-50 border-2 border-green-200 p-6 rounded-[2rem] text-center shadow-sm">
                                                <div className="text-green-600 text-3xl mb-2">🎉</div>
                                                <p className="text-green-800 font-black text-lg">已傳送成功！感謝填寫</p>
                                                <p className="text-green-600 text-xs mt-2 font-bold opacity-80">您的意見對我們非常重要，祝您平安順心。</p>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        {view === 'admin' && (
                            <div className="space-y-8 fade-in">
                                <div className="bg-white p-10 rounded-[3rem] shadow-2xl border border-orange-100">
                                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-8 mb-12">
                                        <div>
                                            <h2 className="text-3xl font-black text-gray-900 tracking-tighter">數據分析面板</h2>
                                            <p className="text-orange-500 font-bold text-[10px] mt-2 tracking-widest uppercase">Real-time Insights</p>
                                        </div>
                                        <div className="flex gap-4">
                                            <div className="bg-orange-50 px-8 py-3 rounded-2xl text-center border border-orange-100 shadow-sm">
                                                <span className="text-[10px] text-orange-600 font-black block tracking-tighter uppercase">總樣本數</span>
                                                <span className="text-4xl font-black text-orange-700 tabular-nums">{responses.length}</span>
                                            </div>
                                        </div>
                                    </div>

                                    {responses.length > 0 ? (
                                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                            <StatItem title="Q1. 飲用經驗" qKey="q1" denominator={responses.length} />
                                            <StatItem title="Q2. 飲用頻率" qKey="q2" denominator={responses.filter(r=>r.q1==='是').length} />
                                            <StatItem title="Q3. 單次飲用量" qKey="q3" denominator={responses.filter(r=>r.q1==='是').length} />
                                            <StatItem title="Q5. 喜歡原因" qKey="q5" denominator={responses.filter(r=>r.q1==='是').length} />
                                            <StatItem title="Q8. 性別比例" qKey="q8" denominator={responses.length} />
                                            <StatItem title="Q9. 年齡層分佈" qKey="q9" denominator={responses.length} />
                                            <StatItem title="Q10. 居住地" qKey="q10" denominator={responses.length} />
                                        </div>
                                    ) : <div className="text-center py-20 text-gray-300 italic">目前尚未有回傳數據</div>}
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="text-center py-10 text-gray-400 text-[10px] font-bold uppercase tracking-widest opacity-50">
                        © 2024 Taitung Red Oolong Consumer Study Group
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

```
